<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Task Tracker</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 40px; color: #222; }
    h1 { color: #1d63ed; margin-bottom: 4px; }
    #env { color: #555; margin-bottom: 20px; }
    li { padding: 6px 0; font-size: 18px; }
    .done { color: #2e7d32; }
  </style>
</head>
<body>
  <h1>Student Task Tracker</h1>
  <div id="env">Loading...</div>
  <ul id="tasks"></ul>
  <script>
    fetch("/api/health").then(r => r.json()).then(h => {
      document.getElementById("env").textContent =
        "Environment: " + h.environment + " | Served by: " + h.host;
    });
    fetch("/api/tasks").then(r => r.json()).then(list => {
      document.getElementById("tasks").innerHTML = list.map(t =>
        `<li class="${t.done ? "done" : ""}">${t.done ? "&#10004;" : "&#9744;"} ${t.title}</li>`).join("");
    });
  </script>
</body>
</html>
